name: Sync to Google Calendar

on:
  schedule:
    - cron: '47 10 * * *'     # daily 10:47 UTC (after sync-verdicts 09:00, off-minute)
  workflow_dispatch:            # manual trigger

jobs:
  sync:
    # Scheduled runs are opt-in: set the repository variable
    # ER_SCHEDULES_ENABLED=true once your secrets are configured
    # (docs/setup-guide.md Stage 3). Manual triggers always work.
    if: github.event_name != 'schedule' || vars.ER_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-repo

      - name: Sync verdicts from Notion (fresh data)
        run: python pipeline/sync_verdicts.py --force
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Sync events to Google Calendar
        run: python pipeline/sync_to_gcal.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}

      - name: Commit updated DB
        uses: ./.github/actions/commit-db
        with:
          paths: event-recommender.db sync_log.txt archive_log.txt
          message: Daily GCal sync
